apiVersion: v1
kind: Service
metadata:
  name: cafe-auth-service
spec:
  selector:
    app: auth
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-api
          image: hautrank2/kub-cafe-auth:1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: TOKEN_KEY
              value: 'jjoi231kdldjk2134'
            - name: ADMIN_EMAIL
              value: 'admin@cafe.local'
            - name: ADMIN_PASSWORD
              value: 'cafe1234'